name: Rodar todos os nossos testes

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  run_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Verify Maven
        run: mvn --version

      - name: Build and run tests
        run: mvn clean test